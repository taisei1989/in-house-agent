name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build ad-hoc release candidate
        run: scripts/build.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent "build/Build/Products/Release/In-House Agent.app" InHouseAgent-candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: InHouseAgent-candidate
          path: InHouseAgent-candidate.zip
